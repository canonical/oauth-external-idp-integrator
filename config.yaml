options:
  authorization_endpoint:
    description: The authorization endpoint.
    type: string
  introspection_endpoint:
    description: The token introspection endpoint.
    type: string
  issuer_url:
    description: The issuer url.
    type: string
  jwks_endpoint:
    description: The jwks validation endpoint.
    type: string
  scope:
    description: Space separated list of allowed scopes for the provider.
    type: string
    default: profile email address phone
  token_endpoint:
    description: Token endpoint.
    type: string
  userinfo_endpoint:
    description: User information endpoint.
    type: string
  client_id:
    description: Client ID.
    default: default_client_id
    type: string
  client_secret:
    description: Legacy plaintext client secret for development only. Use client-secret in production.
    default: default_client_secret
    type: string
  client-secret:
    description: |
      Juju secret URI containing a client-secret key. Grant the secret to this
      application before configuring it. Requires Juju 3.3 or later.
      Takes precedence over client_secret; an unreadable or invalid secret
      blocks the charm rather than falling back to the plaintext option.
    type: secret
  jwt_access_token:
    description: A flag indicating whether the OAuth provider supports jwt tokens.
    default: false
    type: boolean
