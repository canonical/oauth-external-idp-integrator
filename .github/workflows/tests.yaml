name: Tests
on:
  workflow_dispatch:
  workflow_call:

jobs:
  unit-test:
    name: Unit tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: python -m pip install tox

      - name: Run tests
        run: tox -e unit

  integration-test-microk8s:
    name: Integration tests (microk8s)
    runs-on: ubuntu-22.04
    needs:
      - unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup operator environment
        uses: charmed-kubernetes/actions-operator@d8217ad61c15f746727a9d41563c13e9b9fe56e3 # main
        with:
          provider: microk8s
          channel: 1.32-strict/stable
          juju-channel: 3.6/stable
          bootstrap-options: '--agent-version=3.6.19 --debug'
          microk8s-group: snap_microk8s
          microk8s-addons: 'hostpath-storage rbac dns metallb:10.64.140.43-10.64.140.49'

      - name: Wait for MicroK8s to be ready
        run: |
          sudo microk8s status --wait-ready --timeout 300
          sudo microk8s kubectl wait --for=condition=available --timeout=300s \
            -n kube-system deployment/coredns deployment/hostpath-provisioner

      - name: Run integration tests
        # set a predictable model name so it can be consumed by charm-logdump-action
        run: tox -e integration -- --model testing

      - name: Get contexts
        run: kubectl config view
        if: failure()

      - name: Get juju status
        run: juju status --relations
        if: failure()

      - name: Get juju logs
        run: juju debug-log --replay --include oauth-external-idp-integrator/0
        if: failure()
